schema = "pentect.plugin.v1"
name = "local-llm-masking"
description = "Experimental offline generative LLM detection; explicit opt-in."
hooks = ["inspect"]
required = true

[commands]
windows = ["py", "{plugin}/server.py"]
macos = ["python3", "{plugin}/server.py"]
linux = ["python3", "{plugin}/server.py"]

[setup]
profiles = ["cpu", "cuda"]
profile_arg = "--profile"
download = "Gemma 4 E2B checkpoint plus Python runtime: allow 15 GB transfer"
disk = "Allow 25 GB disk and 24 GB RAM for CPU inference"

[setup.commands]
windows = ["py", "{plugin}/setup.py"]
macos = ["python3", "{plugin}/setup.py"]
linux = ["python3", "{plugin}/setup.py"]

[execution]
timeout_ms = 60000
startup_timeout_ms = 300000
max_input_bytes = 1048576
max_output_bytes = 1048576
max_spans = 4096
